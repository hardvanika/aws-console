AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Ivan Dmitriev personal site, backend. The site itself is hosted on AWS Amplify Hosting;
  this stack is the real API every "Send request" goes through: API Gateway HTTP API + Lambda + DynamoDB.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed to call the API (set it to your Amplify URL, e.g. https://main.xxxx.amplifyapp.com).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 128
    Timeout: 5

Resources:
  # ---------- data ----------
  VisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  RequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/request/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitsTable
      Events:
        Request:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /request
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
